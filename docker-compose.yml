version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: docdrive_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docdrive
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docdrive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docdrive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Décommenter pour utiliser Redis (rate limiting avancé)
  # redis:
  #   image: redis:7-alpine
  #   container_name: docdrive_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:
